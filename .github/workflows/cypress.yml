name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Start app
        run: nohup npm run start:app > app.log 2>&1 &

      - name: Wait for app
        run: curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:3000/

      - name: Run Cypress
        run: npx cypress run --browser chrome

      - name: Show app log
        if: failure()
        run: cat app.log

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
